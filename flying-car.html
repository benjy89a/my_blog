<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스카이 드라이브</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;user-select:none}
  canvas{display:block}
  .panel{position:fixed;background:rgba(10,14,35,.55);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;backdrop-filter:blur(4px)}
  #stats{left:16px;top:16px;font-size:15px;line-height:1.6}
  #stats b{font-size:22px;color:#ffd35c}
  #gauges{left:16px;bottom:16px;width:240px}
  #speed{font-size:40px;font-weight:800;line-height:1}
  #speed small{font-size:14px;font-weight:400;opacity:.7;margin-left:4px}
  #alt{opacity:.8;margin:4px 0 8px}
  .bar{height:10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin:3px 0 8px}
  .bar>div{height:100%;width:100%;border-radius:6px;transition:width .15s}
  #fuelBar{background:linear-gradient(90deg,#ff9a3c,#ffd35c)}
  #hpBar{background:linear-gradient(90deg,#3cff9a,#5cd3ff)}
  .lbl{font-size:12px;opacity:.75;display:flex;justify-content:space-between}
  #mapWrap{right:16px;top:16px;padding:6px}
  #minimap{display:block;border-radius:8px}
  #msg{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;white-space:nowrap}
  #msg.show{animation:pop 1.1s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
  #hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,40,.65));opacity:0}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,25,.6);backdrop-filter:blur(3px)}
  .card{background:rgba(15,20,50,.9);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:28px 34px;text-align:center;max-width:440px;margin:16px}
  .card h1{margin:0 0 4px;font-size:40px;background:linear-gradient(90deg,#ffd35c,#ff7a5c,#c15cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card p{opacity:.85;line-height:1.6}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:16px auto;font-size:14px;width:fit-content}
  kbd{background:#2a3060;border:1px solid #4a52a0;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:13px}
  button{margin-top:10px;font:inherit;font-size:18px;font-weight:700;padding:12px 34px;border:0;border-radius:999px;cursor:pointer;color:#1a1030;background:linear-gradient(90deg,#ffd35c,#ff8a5c)}
  button:hover{filter:brightness(1.1)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="hurt"></div>
<div id="stats" class="panel hidden">
  점수 <b id="score">0</b><br>
  링 <span id="rings">0</span> · 콤보 <span id="combo">x1</span><br>
  <span id="boost" style="color:#5cf0ff"></span>
</div>
<div id="gauges" class="panel hidden">
  <div id="speed">0<small>km/h</small></div>
  <div id="alt">고도 0 m</div>
  <div class="lbl"><span>연료</span><span id="fuelTxt">100</span></div>
  <div class="bar"><div id="fuelBar"></div></div>
  <div class="lbl"><span>내구도</span><span id="hpTxt">100</span></div>
  <div class="bar"><div id="hpBar"></div></div>
</div>
<div id="mapWrap" class="panel hidden"><canvas id="minimap" width="170" height="170"></canvas></div>
<div id="msg"></div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>스카이 드라이브</h1>
    <p>노을 진 도시 위를 나는 자동차!<br>황금 링을 통과해서 연료를 채우고 점수를 올리세요.<br>빌딩 옥상에 착륙할 수도 있어요.</p>
    <div class="keys">
      <span><kbd>W</kbd> <kbd>S</kbd></span><span>가속 / 감속·후진</span>
      <span><kbd>A</kbd> <kbd>D</kbd></span><span>좌회전 / 우회전</span>
      <span><kbd>Space</kbd></span><span>상승</span>
      <span><kbd>Shift</kbd></span><span>하강</span>
      <span><kbd>P</kbd> <kbd>M</kbd></span><span>일시정지 / 소리 끄기</span>
    </div>
    <button id="startBtn">출발!</button>
  </div>
</div>
<div id="overScreen" class="overlay hidden">
  <div class="card">
    <h1>게임 오버</h1>
    <p id="overReason"></p>
    <p style="font-size:22px">점수 <b id="finalScore" style="color:#ffd35c">0</b><br><span style="font-size:15px">최고 점수 <span id="bestScore">0</span></span></p>
    <button id="retryBtn">다시 하기 (R)</button>
  </div>
</div>
<div id="pauseScreen" class="overlay hidden"><div class="card"><h1>일시정지</h1><p>P 키를 눌러 계속하기</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xd8735f;
scene.fog = new THREE.Fog(HORIZON, 250, 1500);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 4000);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x10194a) },
      mid: { value: new THREE.Color(HORIZON) },
      bot: { value: new THREE.Color(0x2a1430) },
      sunDir: { value: new THREE.Vector3(-0.6, 0.12, 0.8).normalize() }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 top, mid, bot, sunDir; varying vec3 vP;
      void main(){
        float h = vP.y;
        vec3 c = h > 0.0 ? mix(mid, top, pow(smoothstep(0.0, 0.7, h), 0.6)) : mix(mid, bot, smoothstep(0.0, -0.15, h));
        float s = max(dot(vP, sunDir), 0.0);
        c += vec3(1.0, 0.75, 0.4) * (pow(s, 600.0) * 2.0 + pow(s, 12.0) * 0.35);
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xffb38a, 0x302040, 0.75));
const sun = new THREE.DirectionalLight(0xffc89a, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 1, far: 1200 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(-0.6, 0.55, 0.8).normalize().multiplyScalar(500);

// ---------- city ----------
const CELL = 60, G = 12, CITY = G * CELL, BOUND = CITY + 150;

function groundTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#2b2a33'; g.fillRect(0, 0, 256, 256);
  const lot = 256 * 44 / 60, o = (256 - lot) / 2;
  g.fillStyle = '#4a4752'; g.fillRect(o, o, lot, lot);
  g.fillStyle = '#e8c547';
  for (let i = 0; i < 256; i += 32) { g.fillRect(0, i + 4, 2, 16); g.fillRect(254, i + 4, 2, 16); g.fillRect(i + 4, 0, 16, 2); g.fillRect(i + 4, 254, 16, 2); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
const GROUND = CELL * 70;
const gtex = groundTexture(); gtex.repeat.set(70, 70);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND, GROUND), new THREE.MeshStandardMaterial({ map: gtex, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function facadeTextures() {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 256; return c; };
  const a = mk(), e = mk(), ga = a.getContext('2d'), ge = e.getContext('2d');
  ga.fillStyle = '#3a3c4c'; ga.fillRect(0, 0, 256, 256);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, 256, 256);
  const warm = ['#ffd890', '#ffe6b0', '#bfe3ff', '#ffb070'];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const px = x * 32 + 6, py = y * 32 + 8;
    if (Math.random() < 0.38) {
      const col = warm[(Math.random() * warm.length) | 0];
      ga.fillStyle = col; ga.fillRect(px, py, 20, 16);
      ge.fillStyle = col; ge.fillRect(px, py, 20, 16);
    } else {
      ga.fillStyle = '#151824'; ga.fillRect(px, py, 20, 16);
    }
  }
  const ta = new THREE.CanvasTexture(a), te = new THREE.CanvasTexture(e);
  [ta, te].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; });
  return [ta, te];
}
const buildingMats = [];
for (let i = 0; i < 3; i++) {
  const [map, em] = facadeTextures();
  for (const tint of [0xffffff, 0xc8d0ff, 0xffe0d0, 0xd0f0e8])
    buildingMats.push(new THREE.MeshStandardMaterial({ color: tint, map, emissive: 0xffffff, emissiveMap: em, emissiveIntensity: 0.9, roughness: 0.75, metalness: 0.2 }));
}

function buildingGeo(w, h, d) {
  const geo = new THREE.BoxGeometry(w, h, d), uv = geo.attributes.uv, T = 24;
  // face order: +x, -x, +y, -y, +z, -z (4 verts each); roofs get uv 0 => plain wall color
  for (let f = 0; f < 6; f++) {
    const su = f < 2 ? d / T : f > 3 ? w / T : 0;
    const sv = f === 2 || f === 3 ? 0 : h / T;
    for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * su, uv.getY(k) * sv); }
  }
  geo.translate(0, h / 2, 0);
  return geo;
}

const buildings = new Map(); // "i,j" -> [{x0,x1,z0,z1,h}]
const blinkMat = new THREE.MeshBasicMaterial({ color: 0xff2020 });
const blinkGeo = new THREE.SphereGeometry(0.8, 8, 6);
const parkMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 1 });
const minimapBg = document.createElement('canvas'); minimapBg.width = minimapBg.height = 170;
const mctx = minimapBg.getContext('2d');
mctx.fillStyle = '#1a1830'; mctx.fillRect(0, 0, 170, 170);
const toMap = (x, z) => [(BOUND - x) / (2 * BOUND) * 170, (BOUND - z) / (2 * BOUND) * 170];

for (let i = -G; i < G; i++) for (let j = -G; j < G; j++) {
  const cx = (i + 0.5) * CELL, cz = (j + 0.5) * CELL;
  const list = [];
  buildings.set(i + ',' + j, list);
  const landmark = i === 0 && j === 0;
  if (!landmark && Math.random() < 0.08) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(42, 0.4, 42), parkMat);
    p.position.set(cx, 0.2, cz); p.receiveShadow = true; scene.add(p);
    const [mx, my] = toMap(cx + 21, cz + 21);
    mctx.fillStyle = '#2f6b3a'; mctx.fillRect(mx, my, 42 / (2 * BOUND) * 170, 42 / (2 * BOUND) * 170);
    continue;
  }
  const centre = 1 - Math.hypot(cx, cz) / (CITY * 1.42);
  let w = rand(18, 38), d = rand(18, 38);
  let h = (15 + Math.pow(Math.random(), 2.2) * 170) * (0.55 + centre * 0.95);
  if (landmark) { w = d = 34; h = 330; }
  const x = cx + rand(-(40 - w) / 2, (40 - w) / 2), z = cz + rand(-(40 - d) / 2, (40 - d) / 2);
  const m = new THREE.Mesh(buildingGeo(w, h, d), buildingMats[(Math.random() * buildingMats.length) | 0]);
  m.position.set(x, 0, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  list.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, h });
  if (h > 110) {
    const b = new THREE.Mesh(blinkGeo, blinkMat);
    b.position.set(x, h + 0.8, z); scene.add(b);
  }
  if (landmark) {
    const spire = new THREE.Mesh(new THREE.ConeGeometry(6, 60, 8), new THREE.MeshStandardMaterial({ color: 0xcfd6ff, metalness: 0.8, roughness: 0.2, emissive: 0x304080 }));
    spire.position.set(x, h + 30, z); scene.add(spire);
    list.push({ x0: x - 6, x1: x + 6, z0: z - 6, z1: z + 6, h: h + 60 });
  }
  const [mx, my] = toMap(x + w / 2, z + d / 2);
  const shade = Math.round(70 + clamp(h / 200, 0, 1) * 120);
  mctx.fillStyle = `rgb(${shade},${shade - 10},${shade + 30})`;
  mctx.fillRect(mx, my, w / (2 * BOUND) * 170, d / (2 * BOUND) * 170);
}

// ---------- cars ----------
function buildCar(color) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.3 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a1a22, metalness: 0.5, roughness: 0.5 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x2a4a7a, metalness: 0.9, roughness: 0.1, emissive: 0x0a1a33 });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x5cf0ff });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  add(new THREE.BoxGeometry(2.4, 0.7, 4.6), paint, 0, 0, 0);
  add(new THREE.BoxGeometry(2.2, 0.4, 1.0), paint, 0, -0.12, 2.7);
  add(new THREE.BoxGeometry(1.9, 0.65, 2.2), glass, 0, 0.67, -0.3);
  add(new THREE.BoxGeometry(2.7, 0.12, 0.6), dark, 0, 0.85, -2.15);
  add(new THREE.BoxGeometry(0.12, 0.5, 0.3), dark, -0.9, 0.55, -2.15);
  add(new THREE.BoxGeometry(0.12, 0.5, 0.3), dark, 0.9, 0.55, -2.15);
  const hover = new THREE.CylinderGeometry(0.62, 0.72, 0.4, 16), disc = new THREE.CircleGeometry(0.5, 16);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    add(hover, dark, sx * 1.45, -0.25, sz * 1.6);
    const gl = add(disc, glowMat, sx * 1.45, -0.46, sz * 1.6);
    gl.rotation.x = Math.PI / 2; gl.castShadow = false;
  }
  const jet = new THREE.CylinderGeometry(0.32, 0.4, 0.6, 12);
  for (const sx of [-0.6, 0.6]) {
    add(jet, dark, sx, 0, -2.5).rotation.x = Math.PI / 2;
    const gl = add(new THREE.CircleGeometry(0.28, 12), glowMat, sx, 0, -2.81);
    gl.rotation.y = Math.PI; gl.castShadow = false;
  }
  const head = new THREE.MeshBasicMaterial({ color: 0xffffee }), tail = new THREE.MeshBasicMaterial({ color: 0xff2030 });
  for (const sx of [-0.75, 0.75]) {
    add(new THREE.BoxGeometry(0.5, 0.15, 0.1), head, sx, -0.05, 3.21);
    add(new THREE.BoxGeometry(0.6, 0.15, 0.1), tail, sx, 0.15, -2.31);
  }
  return { group: g, glowMat };
}

function buildNPC(color) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.5, roughness: 0.4 });
  const b = new THREE.Mesh(NPC_BODY, paint); g.add(b);
  const c = new THREE.Mesh(NPC_CAB, NPC_GLASS); c.position.set(0, 0.6, -0.2); g.add(c);
  const t = new THREE.Mesh(NPC_LIGHT, NPC_TAIL); t.position.set(0, 0.1, -2.3); g.add(t);
  const h = new THREE.Mesh(NPC_LIGHT, NPC_HEAD); h.position.set(0, 0, 2.3); g.add(h);
  b.castShadow = true;
  return g;
}
const NPC_BODY = new THREE.BoxGeometry(2.2, 0.8, 4.4), NPC_CAB = new THREE.BoxGeometry(1.8, 0.6, 2.0), NPC_LIGHT = new THREE.BoxGeometry(1.9, 0.18, 0.1);
const NPC_GLASS = new THREE.MeshStandardMaterial({ color: 0x223355, metalness: 0.9, roughness: 0.15 });
const NPC_TAIL = new THREE.MeshBasicMaterial({ color: 0xff2030 }), NPC_HEAD = new THREE.MeshBasicMaterial({ color: 0xffffcc });

const player = buildCar(0xe8323c);
const car = player.group;
car.rotation.order = 'YXZ';
scene.add(car);

const npcs = [];
const npcColors = [0x3c8cff, 0xffd35c, 0xffffff, 0x40e090, 0xb05cff, 0xff8a3c, 0x222230];
for (let n = 0; n < 40; n++) {
  const mesh = buildNPC(npcColors[n % npcColors.length]);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const npc = {
    mesh, alongZ: Math.random() < 0.5, dir,
    fixed: Math.round(rand(-G, G)) * CELL - dir * 4,
    t: rand(-CITY, CITY), y: 14 + ((Math.random() * 4) | 0) * 20, speed: rand(22, 40)
  };
  mesh.rotation.y = npc.alongZ ? (dir > 0 ? 0 : Math.PI) : (dir > 0 ? Math.PI / 2 : -Math.PI / 2);
  scene.add(mesh);
  npcs.push(npc);
}

// ---------- rings ----------
const ringGeo = new THREE.TorusGeometry(5.5, 0.55, 12, 40);
const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd35c, emissive: 0xffaa22, emissiveIntensity: 0.9, metalness: 0.8, roughness: 0.25 });
const rings = [];
for (let n = 0; n < 28; n++) { const r = new THREE.Mesh(ringGeo, ringMat); scene.add(r); rings.push(r); }

function placeRing(r) {
  for (let tries = 0; tries < 50; tries++) {
    const k = Math.round(rand(-G, G)), t = rand(-CITY + 30, CITY - 30), alongZ = Math.random() < 0.5;
    const x = alongZ ? k * CELL : t, z = alongZ ? t : k * CELL;
    const y = Math.random() < 0.22 ? rand(170, 300) : rand(12, 100);
    if (Math.hypot(x - pos.x, z - pos.z) < 80) continue;
    r.position.set(x, y, z);
    r.rotation.set(0, alongZ ? 0 : Math.PI / 2, 0);
    r.userData.baseY = y;
    r.userData.phase = Math.random() * 6;
    return;
  }
}

const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.6, 10).rotateX(Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffd35c, transparent: true, opacity: 0.85 }));
scene.add(arrow);

// ---------- exhaust particles ----------
const puffGeo = new THREE.SphereGeometry(0.28, 6, 5);
const puffs = [];
for (let n = 0; n < 90; n++) {
  const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color: 0x66e0ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.visible = false; scene.add(m);
  puffs.push({ m, life: 0, vel: new THREE.Vector3() });
}
let puffIdx = 0;
function spawnPuff(p, vel, color) {
  const q = puffs[puffIdx++ % puffs.length];
  q.m.position.copy(p); q.vel.copy(vel); q.life = q.max = 0.5;
  q.m.material.color.setHex(color); q.m.visible = true;
}

// ---------- audio ----------
let actx = null, engOsc, engGain, muted = false;
function initAudio() {
  if (actx) { actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engOsc = actx.createOscillator(); engOsc.type = 'sawtooth';
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    engGain = actx.createGain(); engGain.gain.value = 0;
    engOsc.connect(f).connect(engGain).connect(actx.destination); engOsc.start();
  } catch (e) { actx = null; }
}
function tone(f1, f2, dur, type = 'sine', vol = 0.15, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
function crashSound() {
  if (!actx || muted) return;
  const len = actx.sampleRate * 0.4, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.5;
  s.connect(f).connect(g).connect(actx.destination); s.start();
}

// ---------- input ----------
const keys = {};
const k = (...codes) => codes.some(c => keys[c]);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) togglePause();
  if ((e.code === 'KeyR' || e.code === 'Enter') && state === 'over') startGame();
  if (e.code === 'Enter' && state === 'start') startGame();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const c in keys) keys[c] = false; if (state === 'play') togglePause(); });

// ---------- game state ----------
let state = 'start';
const pos = new THREE.Vector3(), prev = new THREE.Vector3();
let yaw, speed, vy, steerS, fuel, hp, score, ringCount, combo, lastRing, boostTime, invuln, shake, hurt, elapsed;
let best = 0;
try { best = +localStorage.getItem('skydrive-best') || 0; } catch (e) {}

function resetGame() {
  pos.set(0, 30, -CITY * 0.4); yaw = 0; speed = 0; vy = 0; steerS = 0;
  fuel = 100; hp = 100; score = 0; ringCount = 0; combo = 1; lastRing = -99;
  boostTime = 0; invuln = 0; shake = 0; hurt = 0; elapsed = 0;
  rings.forEach(placeRing);
  car.position.copy(pos); car.rotation.set(0, 0, 0);
  camera.position.set(pos.x, pos.y + 6, pos.z - 16);
}

function startGame() {
  initAudio();
  resetGame();
  state = 'play';
  ['startScreen', 'overScreen', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
  ['stats', 'gauges', 'mapWrap'].forEach(id => $(id).classList.remove('hidden'));
  flash('출발!', '#ffd35c');
}
function togglePause() {
  state = state === 'play' ? 'pause' : 'play';
  $('pauseScreen').classList.toggle('hidden', state !== 'pause');
}
function gameOver(reason) {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('skydrive-best', best); } catch (e) {} }
  $('overReason').textContent = reason;
  $('finalScore').textContent = score;
  $('bestScore').textContent = best;
  $('overScreen').classList.remove('hidden');
  tone(400, 90, 0.8, 'triangle', 0.2);
}
$('startBtn').onclick = startGame;
$('retryBtn').onclick = startGame;

function flash(text, color) {
  const m = $('msg');
  m.textContent = text; m.style.color = color;
  m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}

function damage(amount) {
  if (invuln > 0) return;
  hp -= amount; invuln = 0.5; shake = 0.7; hurt = 1;
  crashSound();
  if (hp <= 0) { hp = 0; gameOver('차량이 파손됐어요!'); }
}

function collideBuildings() {
  const ci = Math.floor(pos.x / CELL), cj = Math.floor(pos.z / CELL), R = 2.0;
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
    const list = buildings.get((ci + di) + ',' + (cj + dj));
    if (!list) continue;
    for (const b of list) {
      if (pos.x < b.x0 - R || pos.x > b.x1 + R || pos.z < b.z0 - R || pos.z > b.z1 + R || pos.y >= b.h + 1.2) continue;
      if (prev.y >= b.h + 1.19) { // came from above -> land on roof
        pos.y = b.h + 1.2;
        if (vy < -18) damage(Math.round(-vy * 0.6));
        vy = Math.max(vy, 0);
        continue;
      }
      const hit = Math.abs(speed);
      pos.x = prev.x; pos.z = prev.z;
      if (pos.y < b.h + 1.2 && prev.x > b.x0 - R && prev.x < b.x1 + R && prev.z > b.z0 - R && prev.z < b.z1 + R) pos.y = prev.y;
      speed = hit > 6 ? -speed * 0.35 : -Math.sign(speed || 1) * 3;
      if (hit > 8) { damage(Math.round(clamp(hit * 0.45, 6, 40))); flash('쾅!', '#ff5c5c'); }
    }
  }
}

const tmpV = new THREE.Vector3(), fwd = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);

function update(dt) {
  elapsed += dt;
  const throttle = fuel > 0 && k('KeyW', 'ArrowUp');
  const brake = k('KeyS', 'ArrowDown');
  const steer = (k('KeyA', 'ArrowLeft') ? 1 : 0) - (k('KeyD', 'ArrowRight') ? 1 : 0);
  const rise = fuel > 0 && k('Space'), sink = k('ShiftLeft', 'ShiftRight');

  // speed
  const maxS = boostTime > 0 ? 115 : 72;
  if (throttle) speed += 34 * dt;
  if (brake) speed -= (speed > 0 ? 60 : 22) * dt;
  if (!throttle && !brake) speed *= Math.exp(-0.45 * dt);
  if (boostTime > 0) { boostTime -= dt; speed += 45 * dt; }
  if (speed > maxS) speed = Math.max(maxS, speed - 50 * dt);
  speed = Math.max(speed, -22);

  // steering
  steerS += (steer - steerS) * (1 - Math.exp(-8 * dt));
  const grip = clamp(Math.abs(speed) / 20, 0.35, 1) * (speed < -1 ? -1 : 1);
  yaw += steerS * 1.6 * grip * dt;

  // vertical
  let targetVy = (rise ? 24 : 0) - (sink ? 24 : 0);
  if (fuel <= 0) targetVy = -28;
  vy += (targetVy - vy) * (1 - Math.exp(-3 * dt));

  prev.copy(pos);
  fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
  pos.addScaledVector(fwd, speed * dt);
  pos.y += vy * dt;
  if (pos.y > 420) { pos.y = 420; vy = Math.min(vy, 0); }
  let grounded = false;
  if (pos.y < 1.2) {
    if (vy < -20) damage(Math.round(-vy * 0.6));
    pos.y = 1.2; vy = Math.max(vy, 0); grounded = true;
  }
  if (Math.abs(pos.x) > BOUND || Math.abs(pos.z) > BOUND) {
    pos.x = clamp(pos.x, -BOUND, BOUND); pos.z = clamp(pos.z, -BOUND, BOUND);
    speed *= 0.9;
    if (Math.random() < 0.03) flash('도시 경계예요', '#ffffff');
  }
  collideBuildings();
  if (state !== 'play') return;

  // fuel
  fuel -= (0.7 + Math.abs(speed) * 0.017 + (rise ? 0.6 : 0)) * dt;
  if (fuel <= 0) {
    fuel = 0;
    if (grounded || pos.y >= prev.y - 0.001) return gameOver('연료가 바닥났어요!');
  }

  // npc collision
  invuln -= dt;
  for (const n of npcs) {
    if (n.mesh.position.distanceToSquared(pos) < 3.4 * 3.4) {
      if (invuln <= 0) { flash('충돌!', '#ff5c5c'); speed *= -0.3; }
      damage(18);
      if (state !== 'play') return;
    }
  }

  // rings
  for (const r of rings) {
    if (r.position.distanceTo(pos) < 6) {
      combo = elapsed - lastRing < 6 ? Math.min(combo + 1, 5) : 1;
      lastRing = elapsed;
      const pts = 100 * combo;
      score += pts; ringCount++;
      fuel = Math.min(100, fuel + 15);
      boostTime = 1.4;
      flash(combo > 1 ? `+${pts}  콤보 x${combo}!` : `+${pts}`, '#ffd35c');
      tone(880, 1320, 0.25, 'sine', 0.15); tone(1320, 1760, 0.25, 'sine', 0.1, 0.08);
      for (let i = 0; i < 14; i++) spawnPuff(r.position, tmpV.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(14), 0xffd35c);
      placeRing(r);
    }
  }

  // car visuals
  car.position.copy(pos);
  car.position.y += Math.sin(elapsed * 3) * 0.08;
  car.rotation.y = yaw;
  car.rotation.z += (-steerS * clamp(Math.abs(speed) / 40, 0, 1) * 0.4 - car.rotation.z) * (1 - Math.exp(-6 * dt));
  car.rotation.x += (-vy * 0.014 - car.rotation.x) * (1 - Math.exp(-6 * dt));
  const glowPulse = 0.7 + 0.3 * Math.sin(elapsed * 20);
  player.glowMat.color.setRGB(0.36 * glowPulse, 0.94 * glowPulse, 1).lerp(new THREE.Color(0xff8a3c), boostTime > 0 ? 0.6 : 0);

  if ((throttle || boostTime > 0) && Math.random() < 0.6) {
    for (const sx of [-0.6, 0.6]) {
      tmpV.set(sx, 0, -2.9); car.localToWorld(tmpV);
      spawnPuff(tmpV, fwd.clone().multiplyScalar(-6 + speed * 0.2).add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1))), boostTime > 0 ? 0xff9a3c : 0x66e0ff);
    }
  }

  // nearest ring arrow
  let nearest = null, nd = Infinity;
  for (const r of rings) { const d = r.position.distanceToSquared(pos); if (d < nd) { nd = d; nearest = r; } }
  arrow.position.set(pos.x, pos.y + 2.6, pos.z);
  if (nearest) arrow.lookAt(nearest.position);
}

function updateWorld(dt, t) {
  for (const n of npcs) {
    n.t += n.dir * n.speed * dt;
    if (n.t > CITY + 40) n.t = -CITY - 40; else if (n.t < -CITY - 40) n.t = CITY + 40;
    if (n.alongZ) n.mesh.position.set(n.fixed, n.y, n.t); else n.mesh.position.set(n.t, n.y, n.fixed);
  }
  for (const r of rings) {
    r.position.y = r.userData.baseY + Math.sin(t * 1.5 + r.userData.phase) * 1.2;
    r.rotation.z = t * 0.8;
  }
  blinkMat.color.setHex(Math.sin(t * 4) > 0.3 ? 0xff2020 : 0x330505);
  for (const q of puffs) {
    if (!q.m.visible) continue;
    q.life -= dt;
    if (q.life <= 0) { q.m.visible = false; continue; }
    q.m.position.addScaledVector(q.vel, dt);
    const f = q.life / q.max;
    q.m.material.opacity = f * 0.4;
    q.m.scale.setScalar(f * 0.9 + 0.3);
  }
}

function updateCamera(dt) {
  fwd.set(Math.sin(yaw), 0, Math.cos(yaw));
  const back = 13 + Math.abs(speed) * 0.05;
  const desired = tmpV.copy(pos).addScaledVector(fwd, -back).addScaledVector(up, 4.8 + Math.max(0, -vy) * 0.05);
  camera.position.lerp(desired, 1 - Math.exp(-5 * dt));
  if (camera.position.y < 1.5) camera.position.y = 1.5;
  shake = Math.max(0, shake - dt * 1.5);
  if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.8));
  camera.lookAt(pos.x + fwd.x * 8, pos.y + 1.5, pos.z + fwd.z * 8);
  const fov = 68 + clamp(Math.abs(speed) - 30, 0, 90) * 0.22;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-4 * dt)); camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position);
  sun.position.copy(pos).add(SUN_OFFSET);
  sun.target.position.copy(pos);
}

const map = $('minimap').getContext('2d');
function updateHUD() {
  $('score').textContent = score;
  $('rings').textContent = ringCount;
  $('combo').textContent = 'x' + combo;
  $('boost').textContent = boostTime > 0 ? '부스터 작동 중!' : '';
  $('speed').innerHTML = Math.round(Math.abs(speed) * 3.6) + '<small>km/h</small>';
  $('alt').textContent = '고도 ' + Math.round(pos.y - 1.2) + ' m';
  $('fuelTxt').textContent = Math.ceil(fuel);
  $('fuelBar').style.width = fuel + '%';
  $('fuelBar').style.background = fuel < 25 ? '#ff4a4a' : '';
  $('hpTxt').textContent = Math.ceil(hp);
  $('hpBar').style.width = hp + '%';
  hurt = Math.max(0, hurt - 0.03);
  $('hurt').style.opacity = Math.max(hurt, fuel < 15 ? 0.25 + 0.15 * Math.sin(elapsed * 8) : 0);

  map.drawImage(minimapBg, 0, 0);
  map.fillStyle = '#ffd35c';
  for (const r of rings) { const [x, y] = toMap(r.position.x, r.position.z); map.beginPath(); map.arc(x, y, 2.6, 0, 7); map.fill(); }
  const [cx, cy] = toMap(pos.x, pos.z);
  map.save(); map.translate(cx, cy); map.rotate(Math.atan2(-Math.cos(yaw), -Math.sin(yaw)));
  map.fillStyle = '#ff4a5a'; map.strokeStyle = '#fff'; map.lineWidth = 1.2;
  map.beginPath(); map.moveTo(7, 0); map.lineTo(-5, 4.5); map.lineTo(-3, 0); map.lineTo(-5, -4.5); map.closePath(); map.fill(); map.stroke();
  map.restore();
}

// ---------- loop ----------
const clock = new THREE.Clock();
let worldTime = 0;
resetGame();
yaw = 0.6; // pretty angle behind the start menu
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state !== 'pause') {
    worldTime += dt;
    updateWorld(dt, worldTime);
    if (state === 'play') { update(dt); updateHUD(); }
    else if (state === 'start') { yaw += dt * 0.15; pos.y = 60; car.position.copy(pos); car.rotation.y = yaw; }
    updateCamera(dt);
  }
  if (actx && engGain) {
    const on = state === 'play' && !muted;
    engGain.gain.setTargetAtTime(on ? 0.035 : 0, actx.currentTime, 0.1);
    engOsc.frequency.setTargetAtTime(48 + Math.abs(speed) * 1.6 + Math.abs(vy) * 0.8, actx.currentTime, 0.1);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
